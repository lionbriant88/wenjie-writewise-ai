# Staging only: loopback listener, reachable through an authorized SSH tunnel.
# Do not expose before ICP/HTTPS and frozen cutover verification are complete.
server {
    listen 127.0.0.1:8080;
    server_name wenjiezuowen.cn;
    root /srv/writewise/current/public;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 8m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite every client supplied forwarding value; never append.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Vercel-Forwarded-For "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 320s;
        proxy_send_timeout 60s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
}
# Final deployment: replace the loopback listener with `listen 443 ssl;`, add
# ssl_certificate/ssl_certificate_key for the verified domain, then an explicit
# port 80 redirect server after ICP approval. Verify `nginx -t` before reloading.
# Never add an alias for /var/lib/writewise or /etc/writewise.
