<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <rect width="1240" height="1754" fill="#fffdf7"/>
  <rect x="72" y="70" width="1096" height="1614" rx="8" fill="none" stroke="#b9ad96" stroke-width="3"/>
  <text x="112" y="148" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#24211c">ENGLISH WRITING MATERIAL</text>
  <line x1="112" y1="176" x2="1128" y2="176" stroke="#8c826f" stroke-width="2"/>
  <text x="112" y="250" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#24211c">A Small Choice, A Shared Place</text>
  <text x="112" y="314" font-family="Georgia, serif" font-size="24" fill="#302b24">Your school library is planning a “Quiet Corner” for students who need a calm place</text>
  <text x="112" y="354" font-family="Georgia, serif" font-size="24" fill="#302b24">to read, think, or take a short break. Some students want more books; others suggest</text>
  <text x="112" y="394" font-family="Georgia, serif" font-size="24" fill="#302b24">plants, soft lights, and a board for sharing reading recommendations.</text>
  <text x="112" y="478" font-family="Georgia, serif" font-size="24" fill="#302b24">Write an English essay for the student council. Explain one practical idea for the</text>
  <text x="112" y="518" font-family="Georgia, serif" font-size="24" fill="#302b24">Quiet Corner, give reasons, and describe how students could help make it work.</text>
  <rect x="112" y="620" width="1016" height="110" rx="12" fill="#ede8dc"/>
  <text x="148" y="689" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#24211c">Total score: 15 points</text>
  <text x="112" y="818" font-family="Arial, sans-serif" font-size="21" fill="#5b5245">Synthetic evaluation fixture — no personal data.</text>
  <text x="112" y="1586" font-family="Arial, sans-serif" font-size="18" fill="#756b5c">Page 1 of 1</text>
</svg>
