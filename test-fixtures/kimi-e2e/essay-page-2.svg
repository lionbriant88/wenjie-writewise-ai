  <g font-family="Segoe Print, Comic Sans MS, cursive" font-size="35" font-style="italic" fill="#173d72">
    <text x="126" y="286" transform="rotate(-0.5 126 286)">The teachers can choose a quiet monitor each week, but the work is small.</text>
    <text x="132" y="380" transform="rotate(0.5 132 380)">In this way, the corner stays clean and no one feels alone with the job.</text>
    <text x="126" y="474" transform="rotate(-0.4 126 474)">Of course, we should not speak loudly there, or the calm mood will disappear.</text>
    <text x="132" y="568" transform="rotate(0.4 132 568)">A simple sign can remind us to respect other readers.</text>
    <text x="126" y="662" transform="rotate(-0.6 126 662)">If we build this corner together, it will become a small but warm part of school life.</text>
    <text x="132" y="756" transform="rotate(0.4 132 756)">I hope the student council can try this idea next month.</text>
  </g>
  <text x="100" y="1604" font-family="Arial, sans-serif" font-size="19" fill="#6a6258">PRINTED FOOTER — DO NOT TRANSCRIBE · page 2 of 2</text>
