  <g font-family="Segoe Print, Comic Sans MS, cursive" font-size="31" font-style="italic" fill="#173d72">
    <text x="126" y="286" transform="rotate(-0.5 126 286)">They can take turns watering it.</text>
    <text x="132" y="380" transform="rotate(0.5 132 380)">We could put a notebook on the shelf</text>
    <text x="126" y="474" transform="rotate(-0.4 126 474)">for book recommendations.</text>
    <text x="132" y="568" transform="rotate(0.4 132 568)">Then a shy reader may find a story</text>
    <text x="126" y="662" transform="rotate(-0.6 126 662)">that another student really enjoyed.</text>
    <text x="132" y="756" transform="rotate(0.4 132 756)">The teachers can choose a quiet monitor each week,</text>
    <text x="126" y="850" transform="rotate(-0.5 126 850)">but the work is small.</text>
    <text x="132" y="944" transform="rotate(0.5 132 944)">In this way, the corner stays clean</text>
    <text x="126" y="1038" transform="rotate(-0.4 126 1038)">and no one feels alone with the job.</text>
    <text x="132" y="1132" transform="rotate(0.4 132 1132)">Of course, we should not speak loudly there.</text>
    <text x="126" y="1226" transform="rotate(-0.6 126 1226)">A simple sign can remind us to respect other readers.</text>
    <text x="132" y="1320" transform="rotate(0.4 132 1320)">If we build this corner together, it will feel warm.</text>
    <text x="126" y="1414" transform="rotate(-0.5 126 1414)">I hope the student council can try it next month.</text>
  </g>
  <text x="100" y="1604" font-family="Arial, sans-serif" font-size="19" fill="#6a6258">PRINTED FOOTER - DO NOT TRANSCRIBE | page 2 of 2</text>
